openapi: 3.0.3
info:
  title: CareSlot Clinic API
  version: 1.0.0
paths:
  /api/services:
    get:
      summary: List services
      responses:
        '200':
          description: All services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
  /api/providers:
    get:
      summary: List or search providers by name or specialty
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Matching providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Provider' }
  /api/providers/{id}/slots:
    get:
      summary: Free slots for a provider (next 14 days)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unbooked slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
        '404': { description: NOT_FOUND }
  /api/appointments:
    get:
      summary: List appointments
      responses:
        '200':
          description: All appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
    post:
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, serviceId, name, phone]
              properties:
                slotId: { type: string }
                serviceId: { type: string }
                name: { type: string }
                phone: { type: string }
                repeat: { type: boolean, description: Book a series instead of a single appointment }
                frequency:
                  type: string
                  enum: [WEEKLY, BIWEEKLY, MONTHLY]
                  default: WEEKLY
                occurrences:
                  type: integer
                  minimum: 2
                  maximum: 8
                  description: Number of appointments in the series, including the first
      responses:
        '201':
          description: Booked (an Appointment, or a series when repeat is set)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Appointment'
                  - $ref: '#/components/schemas/AppointmentSeries'
        '400': { description: VALIDATION }
        '404': { description: SLOT_NOT_FOUND }
        '409': { description: SLOT_TAKEN }
        '422': { description: OCCURRENCE_CONFLICT }
  /api/appointments/{id}:
    get:
      summary: Appointment detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { description: NOT_FOUND }
  /api/appointments/{id}/cancel:
    post:
      summary: Cancel an appointment (free at any time)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { description: NOT_FOUND }
        '409': { description: ALREADY_CANCELLED }
  /api/account:
    get:
      summary: Patient profile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    post:
      summary: Update patient profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200': { description: Saved }
        '400': { description: VALIDATION }
components:
  schemas:
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        durationMin: { type: integer }
        priceInr: { type: integer }
    Provider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        specialty: { type: string }
        serviceIds: { type: array, items: { type: string } }
    Slot:
      type: object
      properties:
        id: { type: string }
        providerId: { type: string }
        startsAt: { type: string, format: date-time }
        appointmentId: { type: string, nullable: true }
    Appointment:
      type: object
      properties:
        id: { type: string }
        slotId: { type: string }
        providerId: { type: string }
        serviceId: { type: string }
        patientName: { type: string }
        phone: { type: string }
        status: { type: string, enum: [BOOKED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    AppointmentSeries:
      type: object
      properties:
        appointments:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
    Profile:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
