openapi: 3.0.3
info:
  title: CareSlot Clinic API
  version: 1.0.0
paths:
  /api/services:
    get:
      summary: List services
      responses:
        '200':
          description: All services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
  /api/providers:
    get:
      summary: List or search providers by name or specialty
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Matching providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Provider' }
  /api/providers/{id}/slots:
    get:
      summary: Free slots for a provider (next 14 days)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unbooked slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
        '404': { description: NOT_FOUND }
  /api/appointments:
    get:
      summary: List appointments
      responses:
        '200':
          description: All appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
    post:
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId, serviceId, name, phone]
              properties:
                slotId: { type: string }
                serviceId: { type: string }
                name: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { description: VALIDATION }
        '404': { description: SLOT_NOT_FOUND }
        '409': { description: SLOT_TAKEN }
  /api/appointments/{id}:
    get:
      summary: Appointment detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { description: NOT_FOUND }
  /api/appointments/{id}/cancel:
    post:
      summary: Cancel an appointment (flat late-cancellation fee within 24 hours)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancellationReason:
                  type: string
                  enum: [PATIENT_REQUEST, SCHEDULE_CONFLICT, PROVIDER_UNAVAILABLE]
                  default: PATIENT_REQUEST
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { description: NOT_FOUND }
        '409': { description: ALREADY_CANCELLED }
  /api/appointments/{id}/reschedule:
    post:
      summary: Move an appointment to another free slot of the same provider
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newSlotId]
              properties:
                newSlotId:
                  type: string
                  pattern: '^slot_[0-9]{4}$'
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Rescheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { description: VALIDATION }
        '404': { description: NOT_FOUND or SLOT_NOT_FOUND }
        '409': { description: SLOT_TAKEN }
        '422': { description: RESCHEDULE_NOT_ALLOWED }
  /api/account:
    get:
      summary: Patient profile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    post:
      summary: Update patient profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200': { description: Saved }
        '400': { description: VALIDATION }
components:
  schemas:
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        durationMin: { type: integer }
        priceInr: { type: integer }
    Provider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        specialty: { type: string }
        serviceIds: { type: array, items: { type: string } }
    Slot:
      type: object
      properties:
        id: { type: string }
        providerId: { type: string }
        startsAt: { type: string, format: date-time }
        appointmentId: { type: string, nullable: true }
    Appointment:
      type: object
      properties:
        id: { type: string }
        slotId: { type: string }
        providerId: { type: string }
        serviceId: { type: string }
        patientName: { type: string }
        phone: { type: string }
        status: { type: string, enum: [BOOKED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        cancellationReason:
          type: string
          enum: [PATIENT_REQUEST, SCHEDULE_CONFLICT, PROVIDER_UNAVAILABLE]
        feeInr: { type: integer }
        note: { type: string }
    Profile:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
