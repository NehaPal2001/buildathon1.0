openapi: 3.0.3
info:
  title: Demo Shop API
  version: 1.0.0
paths:
  /api/products:
    get:
      summary: List products
      responses:
        '200':
          description: All products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
  /api/search:
    get:
      summary: Search products by name or category
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
  /api/account/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Signed in }
        '401': { description: BAD_CREDENTIALS }
  /api/account/logout:
    post:
      summary: Sign out
      responses:
        '200': { description: Signed out }
  /api/cart:
    get:
      summary: Current cart
      responses:
        '200':
          description: The cart for this session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /api/cart/items:
    post:
      summary: Add a product to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
                qty: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { description: UNKNOWN_PRODUCT }
  /api/cart/items/{id}/remove:
    post:
      summary: Remove a product from the cart
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated cart }
  /api/checkout:
    post:
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: { type: string }
                address: { type: string }
      responses:
        '201': { description: Order placed }
        '400': { description: CART_EMPTY or ADDRESS_REQUIRED }
  /api/orders:
    get:
      summary: Orders for this session
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
components:
  schemas:
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
        category: { type: string }
    CartItem:
      type: object
      properties:
        productId: { type: string }
        qty: { type: integer }
    Cart:
      type: object
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    Order:
      type: object
      properties:
        id: { type: string }
        cartId: { type: string }
        total: { type: integer }
        placedAt: { type: string, format: date-time }
